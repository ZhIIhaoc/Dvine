version: '3.8'

services:
  # Backend
  backend:
    build:
      context: ./DVINE-MVP/backend/DVINE-EXPERIENCE
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/dvine_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=1234
    networks:
      - dvine-network

  # Frontend
  frontend:
    build:
      context: ./DVINE-MVP/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080
    networks:
      - dvine-network
    depends_on:
      - backend

networks:
  dvine-network:
    driver: bridge

volumes:
  backend-data:
  frontend-data: