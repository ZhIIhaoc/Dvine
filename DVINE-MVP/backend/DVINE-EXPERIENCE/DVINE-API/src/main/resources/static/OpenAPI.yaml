openapi: 3.1.0
info:
  title: DVINE Experience API
  description: API documentation for DVINE Experience Management System
  contact:
    name: DVINE Team
    email: support@dvine.com
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Development Server
tags:
  - name: Authentication
    description: User authentication and authorization operations
  - name: Users
    description: User management operations
  - name: Catalogues
    description: Catalogue management operations
  - name: Tours
    description: Tour management operations
  - name: Approvals
    description: Tour approval workflow management operations for pending tour submissions
  - name: Featured Tours
    description: Main page featured tours management operations
  - name: FAQ
    description: Frequently Asked Questions management operations
  - name: Bookings
    description: Tour booking and payment session management operations
  - name: Payments
    description: Payment processing and transaction management operations
  - name: Webhooks
    description: External webhook integrations (Stripe)
paths:
  /users/profile:
    get:
      tags:
        - Users
      summary: Get user profile
      description: Get current user's profile information
      operationId: getUserProfile
      responses:
        "401":
          description: Authentication failed - occurs when JWT token is missing, expired, or invalid in Authorization header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: User not logged in
        "200":
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
                data:
                  userId: 1
                  email: user@example.com
                  phone: '0402777888'
                  postcode: '2017'
                  nickName: Jack
                  firstName: Mary
                  lastName: Lee
                  avatar: https://example.com/avatar.jpg
                  permission: '1'
      security:
        - bearerAuth: []
    put:
      tags:
        - Users
      summary: Update user profile
      description: Update current user's profile information
      operationId: updateUserProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
            example:
              email: user@example.com
              phone: '0402777888'
              postcode: '2017'
              nickName: Jack
              firstName: Mary
              lastName: Lee
              avatar: https://example.com/avatar.jpg
        required: true
      responses:
        "400":
          description: Bad Request - occurs when all profile fields are empty or null (at least one field must be provided for update)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: You should patch at least one field
        "409":
          description: Conflict - occurs when the new email already exists for another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: The email already exists
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: User not logged in
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success

      security:
        - bearerAuth: []
  /tours:
    get:
      tags:
        - Tours
      summary: Filter tours
      description: "Filter tours based on query parameters including tourId, catalogueId,\
        \ title, destination, and price range (regularPrice and premiumPrice). All parameters are optional."
      operationId: search
      parameters:
        - name: tourQueryParam
          in: query
          description: Tour search and filter parameters
          required: true
          schema:
            $ref: "#/components/schemas/TourQueryParam"
      responses:
        "404":
          description: No tours found
          content:
            application/json:
              examples:
                Not Found Response:
                  description: Not Found Response
                  value:
                    code: 1
                    msg: Tour not found
        "200":
          description: Tours found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              examples:
                Success Response:
                  description: Success Response
                  value:
                    code: 0
                    msg: success
                    data:
                      - tourId: 1
                        catalogueId: 5
                        title: Amazing Sydney Harbor Tour
                        destination: "Sydney, Australia"
                        description: Experience the breathtaking views...
                        regularPrice: 299.99
                        premiumPrice: 269.99
                        createdBy: 123
                        primaryImageUrl: https://example.com/images/sydney-harbor-main.jpg
                        images:
                          - https://example.com/images/sydney1.jpg
    post:
      tags:
        - Tours
      summary: Create new tour
      description: "Create a new tour with catalogueId, title, destination, description,\
        \ price, primaryImageUrl, and images. Requires Partner level permission or\
        \ higher. The tour will be automatically assigned to the current user as creator.\
        \ \n\n**Behavior:**\n- **Partners**: Tour is submitted for approval (202 ACCEPTED)\
        \ \n- **Managers**: Tour is created directly (201 CREATED)"
      operationId: createTour
      requestBody:
        description: "Tour creation data. Note: Do not include 'createdBy' field - it will be automatically set to the current user."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Tour"
            examples:
              Tour Creation Example:
                description: Tour Creation Example
                value:
                  catalogueId: 5
                  title: Amazing Sydney Harbor Tour
                  destination: "Sydney, Australia"
                  description: Experience the breathtaking views of Sydney Harbor
                    with our professional guided tour including Opera House and Harbor
                    Bridge visits.
                  regularPrice: 299.99
                  premiumPrice: 269.99
                  primaryImageUrl: https://example.com/images/sydney-harbor-main.jpg
                  images:
                    - https://example.com/images/sydney1.jpg
                    - https://example.com/images/sydney2.jpg
        required: true
      responses:
        "404":
          description: Not Found - occurs when the specified catalogueId does not exist
          content:
            application/json:
              examples:
                Catalogue Not Found:
                  description: Catalogue not found
                  value:
                    code: 1
                    msg: Catalogue not found
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              examples:
                Unauthorized Response:
                  description: Unauthorized Response
                  value:
                    code: 1
                    msg: User not logged in
        "403":
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              examples:
                Forbidden Response:
                  description: Permission denied
                  value:
                    code: 1
                    msg: "Access denied: requires Partner level permission"
        "202":
          description: Tour submitted for approval (Partner users)
          content:
            application/json:
              examples:
                Tour Submitted Response:
                  description: Tour submitted for approval
                  value:
                    code: 0
                    msg: success
        "201":
          description: Tour created successfully (Manager users)
          content:
            application/json:
              examples:
                Success Response:
                  description: Success Response
                  value:
                    code: 0
                    msg: success
      security:
        - bearerAuth: []
    put:
      tags:
        - Tours
      summary: Update tour
      description: "Update an existing tour with tourId, catalogueId, title, destination,\
        \ description, price, primaryImageUrl, and images. Requires Partner level\
        \ permission or higher. Partners can only update tours they created. Managers can update any tour.\
        \ \n\n**Behavior:**\n- **Partners**: Tour update is submitted for approval (202 ACCEPTED)\
        \ \n- **Managers**: Tour is updated directly (200 OK)"
      operationId: updateTour
      requestBody:
        description: "Tour update data. Note: 'createdBy' field is read-only and cannot be modified."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Tour"
            examples:
              Tour Update Example:
                description: Tour Update Example
                value:
                  tourId: 1
                  catalogueId: 5
                  title: Updated Sydney Harbor Tour
                  destination: "Sydney, Australia"
                  description: Experience the breathtaking views of Sydney Harbor
                    with our professional guided tour including Opera House and Harbor
                    Bridge visits.
                  regularPrice: 349.99
                  premiumPrice: 314.99
                  createdBy: 123
                  primaryImageUrl: https://example.com/images/sydney-harbor-main.jpg
                  images:
                    - https://example.com/images/sydney1.jpg
                    - https://example.com/images/sydney2.jpg
        required: true
      responses:
        "404":
          description: Not Found - occurs when the tour or catalogue doesn't exist
          content:
            application/json:
              examples:
                Tour Not Found:
                  description: Tour not found
                  value:
                    code: 1
                    msg: Tour not found
                Catalogue Not Found:
                  description: Catalogue not found
                  value:
                    code: 1
                    msg: Catalogue not found
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              examples:
                Unauthorized Response:
                  description: Unauthorized Response
                  value:
                    code: 1
                    msg: User not logged in
        "403":
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              examples:
                Partner Required Response:
                  description: Permission denied
                  value:
                    code: 1
                    msg: "Access denied: requires Partner level permission"
                Partner and Tour ID Required Response:
                  description: Tour not created by Partner
                  value:
                    code: 1
                    msg: "Partner can only modify the tour created by themselves"
        "202":
          description: Tour update submitted for approval (Partner users)
          content:
            application/json:
              examples:
                Tour Update Submitted Response:
                  description: Tour update submitted for approval
                  value:
                    code: 0
                    msg: success
        "200":
          description: Tour updated successfully (Manager users)
          content:
            application/json:
              examples:
                Success Response:
                  description: Success Response
                  value:
                    code: 0
                    msg: success
      security:
        - bearerAuth: []
    delete:
      tags:
        - Tours
      summary: Delete tour
      description: "Delete a tour by providing tourId. Requires Partner level permission\
        \ or higher. Partners can only delete tours they created. Managers can delete any tour. This action cannot be undone.\
        \ \n\n**Behavior:**\n- **Partners**: Tour deletion is submitted for approval (202 ACCEPTED)\
        \ \n- **Managers**: Tour is deleted directly (200 OK)"
      operationId: deleteTour
      parameters:
        - name: tourId
          in: query
          description: Tour ID to delete
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "404":
          description: Not Found - occurs when the specified tour does not exist
          content:
            application/json:
              examples:
                Not Found Response:
                  description: Not Found Response
                  value:
                    code: 1
                    msg: Tour not found
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              examples:
                Unauthorized Response:
                  description: Unauthorized Response
                  value:
                    code: 1
                    msg: User not logged in
        "403":
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              examples:
                Partner Required Response:
                  description: Permission denied
                  value:
                    code: 1
                    msg: "Access denied: requires Partner level permission"
                Partner and Tour ID Required Response:
                  description: Tour not created by Partner
                  value:
                    code: 1
                    msg: "Partner can only modify the tour created by themselves"
        "202":
          description: Tour deletion submitted for approval (Partner users)
          content:
            application/json:
              examples:
                Tour Deletion Submitted Response:
                  description: Tour deletion submitted for approval
                  value:
                    code: 0
                    msg: success
        "200":
          description: Tour deleted successfully (Manager users)
          content:
            application/json:
              examples:
                Success Response:
                  description: Success Response
                  value:
                    code: 0
                    msg: success
      security:
        - bearerAuth: []
  /catalogues:
    post:
      tags:
        - Catalogues
      summary: Create new catalogue
      description: Create a new catalogue (Manager permission required)
      operationId: createCatalogue
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Catalogue"
            example:
              title: Food
              description: Food catalogue
              coverImage: https://your-cdn.com/cover1.jpg
        required: true
      responses:
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: User not logged in
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: "You don't have permission to access this resource. Required level: Manager"
        "201":
          description: Catalogue created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
      security:
        - bearerAuth: []
    put:
      tags:
        - Catalogues
      summary: Update catalogue
      description: Update an existing catalogue (Manager permission required)
      operationId: updateCatalogue
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Catalogue"
            example:
              catalogueId: 2
              title: Food
              description: Updated food catalogue
              coverImage: https://your-cdn.com/cover1-updated.jpg
        required: true
      responses:
        "404":
          description: Catalogue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: Catalogue not found
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: User not logged in
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: "You don't have permission to access this resource. Required level: Manager"
        "200":
          description: Catalogue updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
      security:
        - bearerAuth: []
    delete:
      tags:
        - Catalogues
      summary: Delete catalogue
      description: Delete a catalogue (Manager permission required)
      operationId: deleteCatalogue
      parameters:
        - name: catalogueId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "404":
          description: Catalogue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: Catalogue not found
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: User not logged in
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: "You don't have permission to access this resource. Required level: Manager"
        "200":
          description: Catalogue deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
      security:
        - bearerAuth: []
  /auth/send-verification-code:
    post:
      tags:
        - Authentication
      summary: Send email verification code
      description: Send a verification code to the specified email address for user registration
      operationId: sendVerificationCode
      requestBody:
        description: Email address to send verification code to
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Email address to send verification code to
              required:
                - email
            example:
              email: newUser@example.com
        required: true
      responses:
        "400":
          description: Bad Request - occurs when email parameter is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: Failed to send verification code
        "200":
          description: Verification code sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: Verification code sent successfully
  /auth/register-with-verification:
    post:
      tags:
        - Authentication
      summary: Register user with email verification
      description: Register a new user account using email verification code
      operationId: registerWithVerification
      requestBody:
        description: User registration data with verification code
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterWithVerificationRequest"
            example:
              user:
                email: newUser@example.com
                phone: "+61412345678"
                password: SecurePassword12!
                postcode: "2017"
                firstName: new
                lastName: user
              verificationCode: "123456"
        required: true
      responses:
        "400":
          description: Bad Request - occurs when verification code is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              examples:
                Invalid Verification Code:
                  description: Verification code validation failure
                  value:
                    code: 1
                    msg: Invalid or expired verification code
                Missing Required Fields:
                  description: Required fields validation failure
                  value:
                    code: 1
                    msg: Registration fields cannot be empty or contain only spaces
        "409":
          description: Email already exists
          content:
            application/json:
              example:
                code: 1
                msg: The email already exists
        "201":
          description: User registered successfully with verification
          content:
            application/json:
              example:
                code: 0
                msg: success
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: "Create a new user account with email, phone, password, postcode,\
        \ firstName, and lastName"
      operationId: register
      requestBody:
        description: User registration data
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistrationRequest"
            example:
              email: john.doe@example.com
              phone: "+61412345678"
              password: SecurePassword123!
              postcode: "2000"
              firstName: John
              lastName: Doe
        required: true
      responses:
        "400":
          description: Bad Request - occurs when required fields are null, empty, or contain only whitespace characters
          content:
            application/json:
              examples:
                Missing Required Fields:
                  description: Required fields validation failure
                  value:
                    code: 1
                    msg: Registration fields cannot be empty or contain only spaces
                Empty Fields:
                  description: Empty or whitespace-only fields
                  value:
                    code: 1
                    msg: Registration fields cannot be empty or contain only spaces
        "409":
          description: Email already exists
          content:
            application/json:
              example:
                code: 1
                msg: The email already exists
        "201":
          description: User registered successfully
          content:
            application/json:
              example:
                code: 0
                msg: success
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Generate new access and refresh tokens using a valid refresh token.
        Use this to maintain user session without re-authentication.
      operationId: refreshToken
      requestBody:
        description: Refresh token request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
            example:
              refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        required: true
      responses:
        "400":
          description: Bad Request - occurs when refresh token is missing or null in request body
          content:
            application/json:
              example:
                code: 1
                msg: Refresh token and user ID are required
        "401":
          description: Authentication failed - occurs when refresh token is expired, malformed, or doesn't exist in Redis cache
          content:
            application/json:
              example:
                code: 1
                msg: Invalid refresh token
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              example:
                code: 0
                msg: success
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Logout current user and invalidate all tokens. Requires valid JWT
        token in Authorization header.
      operationId: logout
      responses:
        "401":
          description: Missing or invalid token
          content:
            application/json:
              example:
                code: 1
                msg: User not logged in
        "200":
          description: Logout successful
          content:
            application/json:
              example:
                code: 0
                msg: success
      security:
        - bearerAuth: []
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticate user with email and password. Returns JWT access and
        refresh tokens upon successful authentication.
      operationId: login
      requestBody:
        description: User login credentials
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/UserLoginRequest"
            examples:
                Login Example:
                    description: Example of user login request
                    value:
                      email: john.doe@example.com
                      password: SecurePassword123!
                Owner Login Example:
                    description: Example of owner login request
                    value:
                      email: i_am_owner@example.com
                      password: 1234
                Manager Login Example:
                    description: Example of manager login request
                    value:
                      email: i_am_manager@example.com
                      password: 1234
                Partner Login Example:
                    description: Example of partner login request
                    value:
                      email: i_am_partner@example.com
                      password: 1234
                Premium Member Login Example:
                    description: Example of premium member login request
                    value:
                      email: i_am_premium@example.com
                      password: 1234
                Regular Member Login Example:
                    description: Example of regular member login request
                    value:
                      email: i_am_regular@example.com
                      password: 1234
        required: true
      responses:
        "401":
          description: Authentication failed - occurs when provided email doesn't exist or password is incorrect
          content:
            application/json:
              example:
                code: 1
                msg: Invalid email or password
        "200":
          description: Login successful
          content:
            application/json:
              example:
                code: 0
                msg: success
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  /auth/send-password-reset-code:
    post:
      tags:
        - Authentication
      summary: Send password reset verification code
      description: Send a verification code to the user's email for password reset.
      operationId: sendPasswordResetCode
      requestBody:
        description: User's email address
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
              required:
                - email
            example:
              email: user@example.com
        required: true
      responses:
        "400":
          description: Bad Request - occurs when user with email doesn't exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: User with this email does not exist
        "200":
          description: Password reset code sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
                data: Password reset code sent successfully
  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset user password
      description: Reset user password using email verification code. The verification code must be valid and not expired.
      operationId: resetPassword
      requestBody:
        description: Password reset request with email, verification code, and new password
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
            example:
              email: user@example.com
              verificationCode: "123456"
              newPassword: NewSecurePassword12!
        required: true
      responses:
        "400":
          description: Bad Request - occurs when validation fails
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              examples:
                Invalid Input:
                  description: Missing required fields
                  value:
                    code: 1
                    msg: Email, verification code, and new password are required
                User Not Found:
                  description: User with email doesn't exist
                  value:
                    code: 1
                    msg: User with this email does not exist
                Invalid Code:
                  description: Verification code is invalid or expired
                  value:
                    code: 1
                    msg: Invalid or expired verification code
                Same Password:
                  description: New password is the same as current password
                  value:
                    code: 1
                    msg: New password cannot be the same as current password
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
                data: Password reset successfully

  /approvals/tours/{pendingTourId}/reject:
    post:
