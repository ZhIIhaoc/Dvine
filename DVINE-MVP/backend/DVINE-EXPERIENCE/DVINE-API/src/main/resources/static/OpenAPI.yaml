openapi: 3.1.0
info:
  title: DVINE Experience API
  description: API documentation for DVINE Experience Management System
  contact:
    name: DVINE Team
    email: support@dvine.com
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Development Server
tags:
  - name: Authentication
    description: User authentication and authorization operations
  - name: Users
    description: User management operations
  - name: Catalogues
    description: Catalogue management operations
  - name: Tours
    description: Tour management operations
  - name: Approvals
    description: Tour approval workflow management operations for pending tour submissions
paths:
  /users/profile:
    get:
      tags:
        - Users
      summary: Get user profile
      description: Get current user's profile information
      operationId: getUserProfile
      responses:
        "401":
          description: Authentication failed - occurs when JWT token is missing, expired, or invalid in Authorization header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: User not logged in
        "200":
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
                data:
                  userId: 1
                  email: user@example.com
                  phone: '0402777888'
                  postcode: '2017'
                  nickName: Jack
                  firstName: Mary
                  lastName: Lee
                  avatar: https://example.com/avatar.jpg
                  permission: '1'
      security:
        - bearerAuth: []
    put:
      tags:
        - Users
      summary: Update user profile
      description: Update current user's profile information
      operationId: updateUserProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
            example:
              email: user@example.com
              phone: '0402777888'
              postcode: '2017'
              nickName: Jack
              firstName: Mary
              lastName: Lee
              avatar: https://example.com/avatar.jpg
        required: true
      responses:
        "400":
          description: Bad Request - occurs when all profile fields are empty or null (at least one field must be provided for update)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: You should patch at least one field
        "409":
          description: Conflict - occurs when the new email already exists for another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: The email already exists
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: User not logged in
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success

      security:
        - bearerAuth: []
  /tours:
    get:
      tags:
        - Tours
      summary: Filter tours
      description: "Filter tours based on query parameters including tourId, catalogueId,\
        \ title, destination, and price range. All parameters are optional."
      operationId: search
      parameters:
        - name: tourQueryParam
          in: query
          description: Tour search and filter parameters
          required: true
          schema:
            $ref: "#/components/schemas/TourQueryParam"
      responses:
        "404":
          description: No tours found
          content:
            application/json:
              examples:
                Not Found Response:
                  description: Not Found Response
                  value:
                    code: 1
                    msg: Tour not found
        "200":
          description: Tours found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              examples:
                Success Response:
                  description: Success Response
                  value:
                    code: 0
                    msg: success
                    data:
                      - tourId: 1
                        catalogueId: 5
                        title: Amazing Sydney Harbor Tour
                        destination: "Sydney, Australia"
                        description: Experience the breathtaking views...
                        price: 299.99
                        createdBy: 123
                        primaryImageUrl: https://example.com/images/sydney-harbor-main.jpg
                        images:
                          - https://example.com/images/sydney1.jpg
    post:
      tags:
        - Tours
      summary: Create new tour
      description: "Create a new tour with catalogueId, title, destination, description,\
        \ price, primaryImageUrl, and images. Requires Partner level permission or\
        \ higher. The tour will be automatically assigned to the current user as creator.\
        \ \n\n**Behavior:**\n- **Partners**: Tour is submitted for approval (202 ACCEPTED)\
        \ \n- **Managers**: Tour is created directly (201 CREATED)"
      operationId: createTour
      requestBody:
        description: "Tour creation data. Note: Do not include 'createdBy' field - it will be automatically set to the current user."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Tour"
            examples:
              Tour Creation Example:
                description: Tour Creation Example
                value:
                  catalogueId: 5
                  title: Amazing Sydney Harbor Tour
                  destination: "Sydney, Australia"
                  description: Experience the breathtaking views of Sydney Harbor
                    with our professional guided tour including Opera House and Harbor
                    Bridge visits.
                  price: 299.99
                  primaryImageUrl: https://example.com/images/sydney-harbor-main.jpg
                  images:
                    - https://example.com/images/sydney1.jpg
                    - https://example.com/images/sydney2.jpg
        required: true
      responses:
        "404":
          description: Not Found - occurs when the specified catalogueId does not exist
          content:
            application/json:
              examples:
                Catalogue Not Found:
                  description: Catalogue not found
                  value:
                    code: 1
                    msg: Catalogue not found
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              examples:
                Unauthorized Response:
                  description: Unauthorized Response
                  value:
                    code: 1
                    msg: User not logged in
        "403":
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              examples:
                Forbidden Response:
                  description: Permission denied
                  value:
                    code: 1
                    msg: "Access denied: requires Partner level permission"
        "202":
          description: Tour submitted for approval (Partner users)
          content:
            application/json:
              examples:
                Tour Submitted Response:
                  description: Tour submitted for approval
                  value:
                    code: 0
                    msg: success
        "201":
          description: Tour created successfully (Manager users)
          content:
            application/json:
              examples:
                Success Response:
                  description: Success Response
                  value:
                    code: 0
                    msg: success
      security:
        - bearerAuth: []
    put:
      tags:
        - Tours
      summary: Update tour
      description: "Update an existing tour with tourId, catalogueId, title, destination,\
        \ description, price, primaryImageUrl, and images. Requires Partner level\
        \ permission or higher. Partners can only update tours they created. Managers can update any tour."
      operationId: updateTour
      requestBody:
        description: "Tour update data. Note: 'createdBy' field is read-only and cannot be modified."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Tour"
            examples:
              Tour Update Example:
                description: Tour Update Example
                value:
                  tourId: 1
                  catalogueId: 5
                  title: Updated Sydney Harbor Tour
                  destination: "Sydney, Australia"
                  description: Experience the breathtaking views of Sydney Harbor
                    with our professional guided tour including Opera House and Harbor
                    Bridge visits.
                  price: 349.99
                  createdBy: 123
                  primaryImageUrl: https://example.com/images/sydney-harbor-main.jpg
                  images:
                    - https://example.com/images/sydney1.jpg
                    - https://example.com/images/sydney2.jpg
        required: true
      responses:
        "404":
          description: Not Found - occurs when the tour or catalogue doesn't exist
          content:
            application/json:
              examples:
                Tour Not Found:
                  description: Tour not found
                  value:
                    code: 1
                    msg: Tour not found
                Catalogue Not Found:
                  description: Catalogue not found
                  value:
                    code: 1
                    msg: Catalogue not found
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              examples:
                Unauthorized Response:
                  description: Unauthorized Response
                  value:
                    code: 1
                    msg: User not logged in
        "403":
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              examples:
                Partner Required Response:
                  description: Permission denied
                  value:
                    code: 1
                    msg: "Access denied: requires Partner level permission"
                Partner and Tour ID Required Response:
                  description: Tour not created by Partner
                  value:
                    code: 1
                    msg: "Partner can only modify the tour created by themselves"
        "200":
          description: Tour updated successfully
          content:
            application/json:
              examples:
                Success Response:
                  description: Success Response
                  value:
                    code: 0
                    msg: success
      security:
        - bearerAuth: []
    delete:
      tags:
        - Tours
      summary: Delete tour
      description: Delete a tour by providing tourId. Requires Partner level permission
        or higher. Partners can only delete tours they created. Managers can delete any tour. This action cannot be undone.
      operationId: deleteTour
      parameters:
        - name: tourId
          in: query
          description: Tour ID to delete
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "404":
          description: Not Found - occurs when the specified tour does not exist
          content:
            application/json:
              examples:
                Not Found Response:
                  description: Not Found Response
                  value:
                    code: 1
                    msg: Tour not found
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              examples:
                Unauthorized Response:
                  description: Unauthorized Response
                  value:
                    code: 1
                    msg: User not logged in
        "403":
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              examples:
                Partner Required Response:
                  description: Permission denied
                  value:
                    code: 1
                    msg: "Access denied: requires Partner level permission"
                Partner and Tour ID Required Response:
                  description: Tour not created by Partner
                  value:
                    code: 1
                    msg: "Partner can only modify the tour created by themselves"
        "200":
          description: Tour deleted successfully
          content:
            application/json:
              examples:
                Success Response:
                  description: Success Response
                  value:
                    code: 0
                    msg: success
      security:
        - bearerAuth: []
  /catalogues:
    post:
      tags:
        - Catalogues
      summary: Create new catalogue
      description: Create a new catalogue (Manager permission required)
      operationId: createCatalogue
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Catalogue"
            example:
              title: Food
              description: Food catalogue
              coverImage: https://your-cdn.com/cover1.jpg
        required: true
      responses:
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: User not logged in
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: "You don't have permission to access this resource. Required level: Manager"
        "201":
          description: Catalogue created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
      security:
        - bearerAuth: []
    put:
      tags:
        - Catalogues
      summary: Update catalogue
      description: Update an existing catalogue (Manager permission required)
      operationId: updateCatalogue
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Catalogue"
            example:
              catalogueId: 2
              title: Food
              description: Updated food catalogue
              coverImage: https://your-cdn.com/cover1-updated.jpg
        required: true
      responses:
        "404":
          description: Catalogue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: Catalogue not found
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: User not logged in
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: "You don't have permission to access this resource. Required level: Manager"
        "200":
          description: Catalogue updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
      security:
        - bearerAuth: []
    delete:
      tags:
        - Catalogues
      summary: Delete catalogue
      description: Delete a catalogue (Manager permission required)
      operationId: deleteCatalogue
      parameters:
        - name: catalogueId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "404":
          description: Catalogue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: Catalogue not found
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: User not logged in
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: "You don't have permission to access this resource. Required level: Manager"
        "200":
          description: Catalogue deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
      security:
        - bearerAuth: []
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: "Create a new user account with email, phone, password, postcode,\
        \ firstName, and lastName"
      operationId: register
      requestBody:
        description: User registration data
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistrationRequest"
            example:
              email: john.doe@example.com
              phone: "+61412345678"
              password: SecurePassword123!
              postcode: "2000"
              firstName: John
              lastName: Doe
        required: true
      responses:
        "400":
          description: Bad Request - occurs when required fields are null, empty, or contain only whitespace characters
          content:
            application/json:
              examples:
                Missing Required Fields:
                  description: Required fields validation failure
                  value:
                    code: 1
                    msg: Registration fields cannot be empty or contain only spaces
                Empty Fields:
                  description: Empty or whitespace-only fields
                  value:
                    code: 1
                    msg: Registration fields cannot be empty or contain only spaces
        "409":
          description: Email already exists
          content:
            application/json:
              example:
                code: 1
                msg: The email already exists
        "201":
          description: User registered successfully
          content:
            application/json:
              example:
                code: 0
                msg: success
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Generate new access and refresh tokens using a valid refresh token.
        Use this to maintain user session without re-authentication.
      operationId: refreshToken
      requestBody:
        description: Refresh token request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
            example:
              refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        required: true
      responses:
        "400":
          description: Bad Request - occurs when refresh token is missing or null in request body
          content:
            application/json:
              example:
                code: 1
                msg: Refresh token and user ID are required
        "401":
          description: Authentication failed - occurs when refresh token is expired, malformed, or doesn't exist in Redis cache
          content:
            application/json:
              example:
                code: 1
                msg: Invalid refresh token
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              example:
                code: 0
                msg: success
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Logout current user and invalidate all tokens. Requires valid JWT
        token in Authorization header.
      operationId: logout
      responses:
        "401":
          description: Missing or invalid token
          content:
            application/json:
              example:
                code: 1
                msg: User not logged in
        "200":
          description: Logout successful
          content:
            application/json:
              example:
                code: 0
                msg: success
      security:
        - bearerAuth: []
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticate user with email and password. Returns JWT access and
        refresh tokens upon successful authentication.
      operationId: login
      requestBody:
        description: User login credentials
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/UserLoginRequest"
            examples:
                Login Example:
                    description: Example of user login request
                    value:
                      email: john.doe@example.com
                      password: SecurePassword123!
                Owner Login Example:
                    description: Example of owner login request
                    value:
                      email: i_am_owner@example.com
                      password: 1234
                Manager Login Example:
                    description: Example of manager login request
                    value:
                      email: i_am_manager@example.com
                      password: 1234
                Partner Login Example:
                    description: Example of partner login request
                    value:
                      email: i_am_partner@example.com
                      password: 1234
                Premium Member Login Example:
                    description: Example of premium member login request
                    value:
                      email: i_am_premium@example.com
                      password: 1234
                Regular Member Login Example:
                    description: Example of regular member login request
                    value:
                      email: i_am_regular@example.com
                      password: 1234
        required: true
      responses:
        "401":
          description: Authentication failed - occurs when provided email doesn't exist or password is incorrect
          content:
            application/json:
              example:
                code: 1
                msg: Invalid email or password
        "200":
          description: Login successful
          content:
            application/json:
              example:
                code: 0
                msg: success
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  /approvals/tours/{pendingTourId}/reject:
    post:
      tags:
        - Approvals
      summary: Reject pending tour
      description: Reject a pending tour (Manager permission required)
      operationId: rejectPendingTour
      parameters:
        - name: pendingTourId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "404":
          description: Pending tour not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: Pending tour not found
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: User not logged in
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: "You don't have permission to access this resource. Required level: Manager"
        "200":
          description: Tour rejected successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
      security:
        - bearerAuth: []
  /approvals/tours/{pendingTourId}/approve:
    post:
      tags:
        - Approvals
      summary: Approve pending tour
      description: Approve a pending tour (Manager permission required)
      operationId: approvePendingTour
      parameters:
        - name: pendingTourId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "404":
          description: Pending tour not found / Tour not found (if tourId is not found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              examples:
                Tour Not Found Response:
                  description: Tour Not Found Response
                  value:
                    code: 1
                    msg: Tour not found
                Pending Tour Not Found Response:
                  description: Pending Tour Not Found Response
                  value:
                    code: 1
                    msg: Pending tour not found
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: User not logged in
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: "You don't have permission to access this resource. Required level: Manager"
        "200":
          description: Tour approved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
      security:
        - bearerAuth: []
  /users/list:
    get:
      tags:
        - Users
      summary: Get all users
      description: Get list of all users (Manager permission required)
      operationId: getUserList
      responses:
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: User not logged in
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: "You don't have permission to access this resource. Required level: Manager"
        "200":
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
                data:
                  - userId: 1
                    email: user@example.com
                    phone: '0402777888'
                    postcode: '2017'
                    nickName: Jack
                    firstName: Mary
                    lastName: Lee
                    avatar: https://example.com/avatar.jpg
                    permission: '0'
                  - userId: 2
                    email: admin@example.com
                    phone: '0402777888'
                    postcode: '2000'
                    nickName: OWNER
                    firstName: '1'
                    lastName: '1'
                    avatar: https://example.com/avatar.jpg
                    permission: '4'

      security:
        - bearerAuth: []
  /users/permission:
    put:
      tags:
        - Users
      summary: Update user permission
      description: |
        Update a user's permission level with role-based access control.
        
        **Access Rules:**
        - **Managers (3)**: Can only modify member-level permissions (Regular=0, Premium=1)
        - **Owners (4)**: Can modify admin-level permissions (Partner=2, Manager=3) but cannot create other Owners
        
        **Permission Levels:**
        - 0: Regular (Member)
        - 1: Premium (Member) 
        - 2: Partner (Admin)
        - 3: Manager (Admin)
        - 4: Owner (Admin - cannot be assigned to others)
      operationId: updateUserPermission
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - permission
              properties:
                userId:
                  type: integer
                  format: int64
                  description: ID of the target user whose permission level will be updated
                  example: 1
                permission:
                  type: integer
                  description: "New permission level to assign to the user. Note: Owner level (4) cannot be assigned."
                  minimum: 0
                  maximum: 4
                  example: 1
            example:
              userId: 1
              permission: 1
        required: true
      responses:
        "400":
          description: Bad Request - Invalid input data that fails client-side validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              examples:
                Missing Required Fields:
                  description: "Occurs when userId or permission fields are null/missing in request body"
                  value:
                    code: 1
                    msg: User ID and permission cannot be null
                Invalid Permission Value:
                  description: "Occurs when permission value is outside valid range (0-4) or not an integer"
                  value:
                    code: 1
                    msg: Invalid permission level
        "401":
          description: Unauthorized - Authentication failed or missing credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              examples:
                Missing JWT Token:
                  description: "Occurs when Authorization header is missing or doesn't contain Bearer token"
                  value:
                    code: 1
                    msg: User not logged in
                Invalid JWT Token:
                  description: "Occurs when JWT token is expired, malformed, or invalid"
                  value:
                    code: 1
                    msg: Invalid or expired token
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              examples:
                Access Denied:
                  description: Access Denied
                  value:
                    code: 1
                    msg: "You don't have permission to access this resource. Required level: Manager"
                Manager Limitation:
                  description: Manager Limitation
                  value:
                    code: 1
                    msg: Managers can only modify member-level permissions (Regular/Premium)
                Insufficient Permissions:
                  description: Insufficient Permissions
                  value:
                    code: 1
                    msg: Insufficient permissions to modify user permissions
                Owner Restriction:
                  description: Owner Restriction
                  value:
                    code: 1
                    msg: Cannot upgrade users to Owner level
        "404":
          description: Target user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: Target user not found
        "200":
          description: User permission updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
      security:
        - bearerAuth: []
