  # Booking and Payment Endpoints
  /bookings/create-session:
    post:
      tags:
        - Bookings
      summary: Create booking and payment session
      description: |
        Create a new tour booking and Stripe payment session for checkout.
        
        **Access:** Open to all users including guests
        - **Authenticated users:** Get premium pricing if eligible, user details pre-filled
        - **Guest users:** Use regular pricing, must provide user details in request
      operationId: createBookingSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
            examples:
              Authenticated User Request:
                description: Request with authentication token (premium pricing if eligible)
                value:
                  tourId: 1
                  quantity: 2
                  travelDate: "2025-08-15"
                  customerNotes: "Anniversary celebration - vegetarian meals preferred"
              Guest User Request:
                description: Request without authentication (regular pricing)
                value:
                  tourId: 1
                  quantity: 2
                  travelDate: "2025-08-15"
                  customerNotes: "First time visitors - looking forward to the experience"
      responses:
        "200":
          description: Booking session created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ReturnResult"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BookingSessionResponse"
              examples:
                Authenticated User Response:
                  description: Response for authenticated user (premium pricing applied)
                  value:
                    code: 0
                    msg: success
                    data:
                      bookingId: 12345
                      bookingReference: "DVINE-20250815-1234"
                      checkoutUrl: "https://checkout.stripe.com/c/pay/cs_test_auth_abc123"
                      totalAmount: 233.98
                      unitPrice: 116.99
                      pricingTier: "premium"
                      userId: 3
                Guest User Response:
                  description: Response for guest user (regular pricing applied)
                  value:
                    code: 0
                    msg: success
                    data:
                      bookingId: 12346
                      bookingReference: "DVINE-20250816-5678"
                      checkoutUrl: "https://checkout.stripe.com/c/pay/cs_test_guest_def456"
                      totalAmount: 259.98
                      unitPrice: 129.99
                      pricingTier: "regular"
                      userId: null
        "400":
          description: Invalid booking request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              examples:
                Invalid Quantity:
                  description: Quantity exceeds maximum allowed
                  value:
                    code: 1
                    msg: "Quantity must be between 1 and 10"
                Invalid Travel Date:
                  description: Travel date in the past
                  value:
                    code: 1
                    msg: "Travel date must be in the future"
                Missing Required Fields:
                  description: Required fields are missing
                  value:
                    code: 1
                    msg: "Missing required field: tourId"
        "404":
          description: Tour not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: "Tour not found"
        "401":
          description: Invalid authentication token (only when token is provided but invalid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: "Invalid or expired JWT token"
      security:
        - bearerAuth: []
        - {}

