                msg: "You don't have permission to access this resource. Required level: Manager"
        "200":
          description: Featured tours management data retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
                data:
                  - featuredTourId: 1
                    tourId: 5
                    displayOrder: 1
                    createTime: '2025-07-15T10:30:00'
                    updateTime: '2025-07-15T10:30:00'
                  - featuredTourId: 2
                    tourId: 8
                    displayOrder: 2
                    createTime: '2025-07-15T11:00:00'
                    updateTime: '2025-07-15T11:00:00'
      security:
        - bearerAuth: []
  /featured-tours/reorder:
    put:
      tags:
        - Featured Tours
      summary: Reorder featured tours
      description: Update the display order of featured tours (Manager permission required)
      operationId: reorderFeaturedTours
      requestBody:
        description: List of featured tours with new display orders
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/FeaturedTour"
            example:
              - tourId: 8
                displayOrder: 1
              - tourId: 5
                displayOrder: 2
              - tourId: 12
                displayOrder: 3
        required: true
      responses:
        "400":
          description: Invalid reorder request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              examples:
                Invalid Order:
                  description: Display orders must be consecutive starting from 1
                  value:
                    code: 1
                    msg: Display orders must be consecutive starting from 1
                Tour Not Featured:
                  description: One or more tours are not currently featured
                  value:
                    code: 1
                    msg: Tour 5 is not featured
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: User not logged in
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: "You don't have permission to access this resource. Required level: Manager"
        "200":
          description: Featured tours reordered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
      security:
        - bearerAuth: []
  /faqs:
    get:
      tags:
        - FAQ
      summary: Get all FAQs
      description: Retrieve all frequently asked questions. Public access - no authentication required.
      operationId: findAllFaqs
      responses:
        "200":
          description: FAQs retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
                data:
                  - faqId: 1
                    question: What is DVINE?
                    answer: DVINE is a comprehensive tour experience management platform that connects travelers with amazing destinations and experiences.
                    createTime: '2025-07-18T10:00:00'
                    updateTime: '2025-07-18T10:00:00'
                  - faqId: 2
                    question: How do I book a tour?
                    answer: You can browse our tours, select your preferred tour, and follow the booking process. Authentication is required for booking.
                    createTime: '2025-07-18T10:30:00'
                    updateTime: '2025-07-18T10:30:00'
    post:
      tags:
        - FAQ
      summary: Create new FAQ
      description: Create a new frequently asked question (Manager permission required)
      operationId: createFaq
      requestBody:
        description: FAQ creation data
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Faq"
            example:
              question: What payment methods do you accept?
              answer: We accept all major credit cards, PayPal, and bank transfers for tour bookings.
        required: true
      responses:
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: User not logged in
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: "You don't have permission to access this resource. Required level: Manager"
        "201":
          description: FAQ created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
      security:
        - bearerAuth: []
    put:
      tags:
        - FAQ
      summary: Update FAQ
      description: Update an existing frequently asked question (Manager permission required)
      operationId: updateFaq
      requestBody:
        description: FAQ update data
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Faq"
            example:
              faqId: 1
              question: What is DVINE Experience Platform?
              answer: DVINE is a comprehensive tour experience management platform that connects travelers with amazing destinations and experiences worldwide.
        required: true
      responses:
        "404":
          description: FAQ not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: FAQ not found
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: User not logged in
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: "You don't have permission to access this resource. Required level: Manager"
        "200":
          description: FAQ updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
      security:
        - bearerAuth: []
  /faqs/{faqId}:
    get:
      tags:
        - FAQ
      summary: Get FAQ by ID
      description: Retrieve a specific frequently asked question by its ID. Public access - no authentication required.
      operationId: findFaqById
      parameters:
        - name: faqId
          in: path
          description: FAQ ID
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "404":
          description: FAQ not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: FAQ not found
        "200":
          description: FAQ found successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
                data:
                  faqId: 1
                  question: What is DVINE?
                  answer: DVINE is a comprehensive tour experience management platform that connects travelers with amazing destinations and experiences.
                  createTime: '2025-07-18T10:00:00'
                  updateTime: '2025-07-18T10:00:00'
    delete:
      tags:
        - FAQ
      summary: Delete FAQ
      description: Delete a frequently asked question (Manager permission required)
      operationId: deleteFaq
      parameters:
        - name: faqId
          in: path
          description: FAQ ID to delete
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "404":
          description: FAQ not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: FAQ not found
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: User not logged in
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: "You don't have permission to access this resource. Required level: Manager"
        "200":
          description: FAQ deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
      security:
        - bearerAuth: []
components:
  schemas:
    ReturnResult:
      type: object
      description: Standard API response wrapper
      properties:
        code:
          type: integer
          format: int32
          description: "Response code (0 for success, 1 for failure)"
          example: 0
        msg:
          type: string
          description: Response message
          example: success
        data:
          description: Response data (can be any object)
          example: {}
      example:
        code: 0
        msg: success
    User:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        password:
          type: string
        email:
          type: string
        phone:
          type: string
        postcode:
          type: string
        nickName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        avatar:
          type: string
        permission:
          type: integer
          format: int32
        emptyPatch:
          type: boolean
    Tour:
      type: object
      description: Tour information
      properties:
        tourId:
          type: integer
          format: int64
          description: Unique tour identifier
          example: 1
        catalogueId:
          type: integer
          format: int64
          description: ID of the catalogue this tour belongs to
          example: 5
        title:
          type: string
          description: Tour title
          example: Amazing Sydney Harbor Tour
        destination:
          type: string
          description: Tour destination
          example: "Sydney, Australia"
        description:
          type: string
          description: Detailed tour description
          example: Experience the breathtaking views of Sydney Harbor with our professional
            guided tour including Opera House and Harbor Bridge visits.
        price:
          type: number
          format: double
          description: Tour price in AUD
          example: 299.99
        primaryImageUrl:
          type: string
          description: URL of the primary tour image
          example: https://example.com/images/sydney-harbor-main.jpg
        images:
          type: array
          description: List of additional image URLs
          example:
            - https://example.com/images/sydney1.jpg
            - https://example.com/images/sydney2.jpg
          items:
            type: string
        createdBy:
          type: integer
          format: int64
          description: User ID who created this tour (automatically set on creation)
          example: 123
          readOnly: true
      required:
        - catalogueId
        - description
        - destination
        - price
        - primaryImageUrl
        - title
    Catalogue:
      type: object
      description: Catalogue information
      properties:
        catalogueId:
          type: integer
          format: int64
          description: Unique catalogue identifier
          example: 1
        title:
          type: string
          description: Catalogue title
          example: Australian Adventures
        description:
          type: string
          description: Catalogue description
          example: Discover the best of Australia with our curated collection of tours
            and experiences.
        coverImage:
          type: string
          description: URL of the catalogue cover image
          example: https://example.com/images/australia-cover.jpg
      required:
        - coverImage
        - description
        - title
    UserRegistrationRequest:
      type: object
      description: User registration request
      properties:
        email:
          type: string
          description: User's email address
          example: john.doe@example.com
        phone:
          type: string
          description: User's phone number
          example: "+61412345678"
        password:
          type: string
          description: User's password
          example: SecurePassword123!
        postcode:
          type: string
          description: User's postcode
          example: 2000
        firstName:
          type: string
          description: User's first name
          example: John
        lastName:
          type: string
          description: User's last name
          example: Doe
      required:
        - email
        - firstName
        - lastName
        - password
    RegisterWithVerificationRequest:
      type: object
      description: User registration request with email verification code
      properties:
        user:
          $ref: "#/components/schemas/UserRegistrationRequest"
        verificationCode:
          type: string
          description: Email verification code
          example: "123456"
      required:
        - user
        - verificationCode
    ResetPasswordRequest:
      type: object
      description: Password reset request with email verification
      properties:
        email:
          type: string
          format: email
          description: User's email address
          example: john.doe@example.com
        verificationCode:
          type: string
          description: Email verification code for password reset
          example: "123456"
        newPassword:
          type: string
          description: New password for the user
          example: NewSecurePassword123!
      required:
        - email
        - verificationCode
        - newPassword
    TokenRefreshRequest:
      type: object
      description: Token refresh request
      properties:
        refreshToken:
          type: string
          description: Refresh token for obtaining new access token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      required:
        - refreshToken
    UserLoginRequest:
      type: object
      description: User login request
      properties:
        email:
          type: string
          description: User's email address
          example: john.doe@example.com
        password:
          type: string
          description: User's password
          example: SecurePassword123!
      required:
        - email
        - password
    TourPageQueryParam:
      type: object
      description: Tour search and filter parameters
      properties:
        page:
          type: integer
          format: int32
          description: Page number for pagination (starts from 0)
          example: 1
        size:
          type: integer
          format: int32
          description: Number of items per page
          example: 10
        catalogueId:
          type: integer
          format: int64
          description: Filter tours by catalogue ID
          example: 5
        catalogueName:
          type: string
          description: Filter tours by catalogue name (exact match)
          example: Adventure Tours
        title:
          type: string
          description: Search tours by title (partial match)
          example: Sydney
        destination:
          type: string
          description: Search tours by destination (partial match)
          example: Australia
        minPrice:
          type: number
          format: double
          description: Minimum price filter
          example: 100.0
        maxPrice:
          type: number
          format: double
          description: Maximum price filter
          example: 500.0
    TourQueryParam:
      type: object
      description: Tour search and filter parameters
      properties:
        tourId:
          type: integer
          format: int64
          description: Specific tour ID to search for
          example: 1
        catalogueId:
          type: integer
          format: int64
          description: Filter tours by catalogue ID
          example: 5
        title:
          type: string
          description: Search tours by title (partial match)
          example: Sydney
        destination:
          type: string
          description: Search tours by destination (partial match)
          example: Australia
        minPrice:
          type: number
          format: double
          description: Minimum price filter
          example: 100.0
        maxPrice:
          type: number
          format: double
          description: Maximum price filter
          example: 500.0
        createdBy:
          type: integer
          format: int64
          description: Filter tours by creator ID
          example: 123
    FeaturedTour:
      type: object
      description: Featured tour information for management
      properties:
        featuredTourId:
          type: integer
          format: int64
          description: Unique featured tour identifier
          example: 1
        tourId:
          type: integer
          format: int64
          description: ID of the tour that is featured
          example: 5
        displayOrder:
          type: integer
          format: int32
          description: Display order on main page (1 = first)
          example: 1
        createTime:
          type: string
          format: date-time
          description: When the tour was added to featured list
          example: '2025-07-15T10:30:00'
        updateTime:
          type: string
          format: date-time
          description: When the featured tour entry was last updated
          example: '2025-07-15T10:30:00'
      required:
        - tourId
        - displayOrder
    Faq:
      type: object
      description: Frequently Asked Question information
      properties:
        faqId:
          type: integer
          format: int64
          description: Unique FAQ identifier
          example: 1
        question:
          type: string
          description: FAQ question text
          example: What is DVINE?
        answer:
          type: string
          description: FAQ answer text
          example: DVINE is a comprehensive tour experience management platform that connects travelers with amazing destinations and experiences.
        createTime:
          type: string
          format: date-time
          description: When the FAQ was created
          example: '2025-07-18T10:00:00'
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: When the FAQ was last updated
          example: '2025-07-18T10:00:00'
          readOnly: true
      required:
        - question
        - answer
  securitySchemes:
    bearerAuth:
      type: http
      description: "JWT token for authentication. Format: Bearer {token}"
      scheme: bearer
      bearerFormat: JWT
