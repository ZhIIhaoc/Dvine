  /payments/{paymentId}/refund:
    post:
      tags:
        - Payments
      summary: Process refund (Admin)
      description: Process a manual refund for a payment (Manager+ access required)
      operationId: processRefund
      parameters:
        - name: paymentId
          in: path
          description: Payment ID
          required: true
          schema:
            type: integer
            format: int64
          example: 1
        - name: refundAmount
          in: query
          description: Refund amount
          required: true
          schema:
            type: number
            format: decimal
          example: 129.99
      responses:
        "200":
          description: Refund processed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
        "400":
          description: Invalid refund request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              examples:
                Invalid Amount:
                  description: Refund amount exceeds payment amount
                  value:
                    code: 1
                    msg: "Refund amount $500.00 exceeds payment amount $259.98"
                Negative Amount:
                  description: Refund amount must be positive
                  value:
                    code: 1
                    msg: "Refund amount must be greater than 0"
                Already Refunded:
                  description: Payment already fully refunded
                  value:
                    code: 1
                    msg: "Payment has already been fully refunded"
        "404":
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: "Payment with ID 999 not found"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: "User not logged in"
        "422":
          description: Payment cannot be refunded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              examples:
                Payment Failed:
                  description: Cannot refund failed payment
                  value:
                    code: 1
                    msg: "Cannot refund payment with status FAILED"
                Stripe Error:
                  description: Stripe refund processing failed
                  value:
                    code: 1
                    msg: "Stripe refund failed: Charge already refunded"
      security:
        - bearerAuth: []

