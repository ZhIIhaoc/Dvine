      security:
        - bearerAuth: []
components:
  schemas:
    ReturnResult:
      type: object
      description: Standard API response wrapper
      properties:
        code:
          type: integer
          format: int32
          description: "Response code (0 for success, 1 for failure)"
          example: 0
        msg:
          type: string
          description: Response message
          example: success
        data:
          description: Response data (can be any object)
          example: {}
      example:
        code: 0
        msg: success
    User:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        password:
          type: string
        email:
          type: string
        phone:
          type: string
        postcode:
          type: string
        nickName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        avatar:
          type: string
        permission:
          type: integer
          format: int32
        emptyPatch:
          type: boolean
    Tour:
      type: object
      description: Tour information
      properties:
        tourId:
          type: integer
          format: int64
          description: Unique tour identifier
          example: 1
        catalogueId:
          type: integer
          format: int64
          description: ID of the catalogue this tour belongs to
          example: 5
        title:
          type: string
          description: Tour title
          example: Amazing Sydney Harbor Tour
        destination:
          type: string
          description: Tour destination
          example: "Sydney, Australia"
        description:
          type: string
          description: Detailed tour description
          example: Experience the breathtaking views of Sydney Harbor with our professional
            guided tour including Opera House and Harbor Bridge visits.
        regularPrice:
          type: number
          format: double
          description: Tour price in AUD for regular members (permission level 0)
          example: 299.99
        premiumPrice:
          type: number
          format: double
          description: Tour price in AUD for premium members (permission level 1+)
          example: 269.99
        primaryImageUrl:
          type: string
          description: URL of the primary tour image
          example: https://example.com/images/sydney-harbor-main.jpg
        images:
          type: array
          description: List of additional image URLs
          example:
            - https://example.com/images/sydney1.jpg
            - https://example.com/images/sydney2.jpg
          items:
            type: string
        createdBy:
          type: integer
          format: int64
          description: User ID who created this tour (automatically set on creation)
          example: 123
          readOnly: true
      required:
        - catalogueId
        - description
        - destination
        - price
        - primaryImageUrl
        - title
    Catalogue:
      type: object
      description: Catalogue information
      properties:
        catalogueId:
          type: integer
          format: int64
          description: Unique catalogue identifier
          example: 1
        title:
          type: string
          description: Catalogue title
          example: Australian Adventures
        description:
          type: string
          description: Catalogue description
          example: Discover the best of Australia with our curated collection of tours
            and experiences.
        coverImage:
          type: string
          description: URL of the catalogue cover image
          example: https://example.com/images/australia-cover.jpg
      required:
        - coverImage
        - description
        - title
    UserRegistrationRequest:
      type: object
      description: User registration request
      properties:
        email:
          type: string
          description: User's email address
          example: john.doe@example.com
        phone:
          type: string
          description: User's phone number
          example: "+61412345678"
        password:
          type: string
          description: User's password
          example: SecurePassword123!
        postcode:
          type: string
          description: User's postcode
          example: 2000
        firstName:
          type: string
          description: User's first name
          example: John
        lastName:
          type: string
          description: User's last name
          example: Doe
      required:
        - email
        - firstName
        - lastName
        - password
    TokenRefreshRequest:
      type: object
      description: Token refresh request
      properties:
        refreshToken:
          type: string
          description: Refresh token for obtaining new access token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      required:
        - refreshToken
    UserLoginRequest:
      type: object
      description: User login request
      properties:
        email:
          type: string
          description: User's email address
          example: john.doe@example.com
        password:
          type: string
          description: User's password
          example: SecurePassword123!
      required:
        - email
        - password
    TourPageQueryParam:
      type: object
      description: Tour search and filter parameters
      properties:
        page:
          type: integer
          format: int32
          description: Page number for pagination (starts from 0)
          example: 1
        size:
          type: integer
          format: int32
          description: Number of items per page
          example: 10
        catalogueId:
          type: integer
          format: int64
          description: Filter tours by catalogue ID
          example: 5
        catalogueName:
          type: string
          description: Filter tours by catalogue name (exact match)
          example: Adventure Tours
        title:
          type: string
          description: Search tours by title (partial match)
          example: Sydney
        destination:
          type: string
          description: Search tours by destination (partial match)
          example: Australia
        minPrice:
          type: number
          format: double
          description: Minimum price filter
          example: 100.0
        maxPrice:
          type: number
          format: double
          description: Maximum price filter
          example: 500.0
    TourQueryParam:
      type: object
      description: Tour search and filter parameters
      properties:
        tourId:
          type: integer
          format: int64
          description: Specific tour ID to search for
          example: 1
        catalogueId:
          type: integer
          format: int64
          description: Filter tours by catalogue ID
          example: 5
        title:
          type: string
          description: Search tours by title (partial match)
          example: Sydney
        destination:
          type: string
          description: Search tours by destination (partial match)
          example: Australia
        minPrice:
          type: number
          format: double
          description: Minimum price filter
          example: 100.0
        maxPrice:
          type: number
          format: double
          description: Maximum price filter
          example: 500.0
        createdBy:
          type: integer
          format: int64
          description: Filter tours by creator ID
          example: 123
    FeaturedTour:
      type: object
      description: Featured tour information for management
      properties:
        featuredTourId:
          type: integer
          format: int64
          description: Unique featured tour identifier
          example: 1
        tourId:
          type: integer
          format: int64
          description: ID of the tour that is featured
          example: 5
        displayOrder:
          type: integer
          format: int32
          description: Display order on main page (1 = first)
          example: 1
        createTime:
          type: string
          format: date-time
          description: When the tour was added to featured list
          example: '2025-07-15T10:30:00'
        updateTime:
          type: string
          format: date-time
          description: When the featured tour entry was last updated
          example: '2025-07-15T10:30:00'
      required:
        - tourId
        - displayOrder
    Faq:
      type: object
      description: Frequently Asked Question information
      properties:
        faqId:
          type: integer
          format: int64
          description: Unique FAQ identifier
          example: 1
        question:
          type: string
          description: FAQ question text
          example: What is DVINE?
        answer:
          type: string
          description: FAQ answer text
          example: DVINE is a comprehensive tour experience management platform that connects travelers with amazing destinations and experiences.
        createTime:
          type: string
          format: date-time
          description: When the FAQ was created
          example: '2025-07-18T10:00:00'
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: When the FAQ was last updated
          example: '2025-07-18T10:00:00'
          readOnly: true
      required:
        - question
        - answer
    # Payment System Schemas
    CreateBookingRequest:
      type: object
      description: Request to create a new tour booking
      properties:
        tourId:
          type: integer
          format: int64
          description: ID of the tour to book
          example: 1
        quantity:
          type: integer
          description: Number of participants (1-10)
          minimum: 1
          maximum: 10
          example: 2
        travelDate:
          type: string
          format: date
          description: Date when the tour takes place
          example: '2025-08-15'
        customerNotes:
          type: string
          description: Special requests or notes from customer
          maxLength: 500
          example: 'Vegetarian meal required'
      required:
        - tourId
        - quantity
        - travelDate

    BookingSessionResponse:
      type: object
      description: Response containing booking session information
      properties:
        bookingId:
          type: integer
          format: int64
          description: Unique booking identifier
          example: 12345
        bookingReference:
          type: string
          description: Human-readable booking reference in format DVINE-YYYYMMDD-XXXX
          example: 'DVINE-20250815-1234'
        checkoutUrl:
          type: string
          format: uri
          description: Stripe checkout session URL
          example: 'https://checkout.stripe.com/c/pay/cs_test_abc123'
      required:
        - bookingId
        - bookingReference
        - checkoutUrl

    Booking:
      type: object
      description: Tour booking information
      properties:
        bookingId:
          type: integer
          format: int64
          description: Unique booking identifier
          example: 12345
        userId:
          type: integer
          format: int64
          description: ID of user who made the booking
          example: 1
        tourId:
          type: integer
          format: int64
          description: ID of the booked tour
          example: 1
        bookingReference:
          type: string
          description: Human-readable booking reference in format DVINE-YYYYMMDD-XXXX
          example: 'DVINE-20250815-1234'
        quantity:
          type: integer
          description: Number of participants
          example: 2
        unitPrice:
          type: number
          format: decimal
          description: Price per person at time of booking
          example: 299.99
        totalAmount:
          type: number
          format: decimal
          description: Total amount for the booking
          example: 599.98
        currency:
          type: string
          description: Currency code
          example: 'AUD'
        travelDate:
          type: string
          format: date
          description: Date when the tour takes place
          example: '2025-08-15'
        status:
          type: string
          enum: [ PENDING, CONFIRMED, CANCELLED ]
          description: Current booking status
          example: 'CONFIRMED'
        customerNotes:
          type: string
          description: Special requests from customer
          example: 'Vegetarian meal required'
        createTime:
          type: string
          format: date-time
          description: When the booking was created
          example: '2025-07-18T14:30:00'
        updateTime:
          type: string
          format: date-time
          description: When the booking was last updated
          example: '2025-07-18T14:30:00'
        userEmail:
          type: string
          description: Email of the user who made the booking
          example: 'user@example.com'
        tourTitle:
          type: string
          description: Title of the booked tour
          example: 'Sydney Harbour Bridge Climb'
        tourDestination:
          type: string
          description: Destination of the booked tour
          example: 'Sydney, Australia'
      required:
        - bookingId
        - userId
        - tourId
        - bookingReference
        - quantity
        - unitPrice
        - totalAmount
        - travelDate
        - status

    Payment:
      type: object
      description: Payment transaction information
      properties:
        paymentId:
          type: integer
          format: int64
          description: Unique payment identifier
          example: 67890
        bookingId:
          type: integer
          format: int64
          description: Associated booking ID
          example: 12345
        stripeSessionId:
          type: string
          description: Stripe checkout session ID
          example: 'cs_test_abc123'
        stripePaymentIntentId:
          type: string
          description: Stripe payment intent ID
          example: 'pi_test_def456'
        amount:
          type: number
          format: decimal
          description: Payment amount
          example: 599.98
        currency:
          type: string
          description: Currency code
          example: 'AUD'
        status:
          type: string
          enum: [ PENDING, PROCESSING, SUCCEEDED, FAILED, CANCELLED, REFUNDED ]
          description: Current payment status
          example: 'SUCCEEDED'
        paymentMethod:
          type: string
          description: Payment method used
          example: 'card'
        refundAmount:
          type: number
          format: decimal
          description: Amount refunded (if any)
          example: 0.00
        paidAt:
          type: string
          format: date-time
          description: When payment was completed
          example: '2025-07-18T14:35:00'
        createTime:
          type: string
          format: date-time
          description: When payment record was created
          example: '2025-07-18T14:30:00'
        bookingReference:
          type: string
          description: Associated booking reference in format DVINE-YYYYMMDD-XXXX
          example: 'DVINE-20250815-1234'
      required:
        - paymentId
        - bookingId
        - amount
        - currency
        - status

    PaymentStats:
      type: object
      description: Payment statistics and analytics data
      properties:
        totalRevenue:
          type: number
          format: decimal
          description: Total revenue from all payments
          example: 15789.50
        totalTransactions:
          type: integer
          description: Total number of completed transactions
          example: 127
        successRate:
          type: number
          format: percentage
          description: Payment success rate as percentage
          example: 98.5
        averageTransactionAmount:
          type: number
          format: decimal
          description: Average amount per transaction
          example: 124.33
        totalRefunds:
          type: number
          format: decimal
          description: Total amount refunded
          example: 250.00
        refundRate:
          type: number
          format: percentage
          description: Refund rate as percentage
          example: 1.6
      required:
        - totalRevenue
        - totalTransactions
        - successRate
        - averageTransactionAmount

    RegisterWithVerificationRequest:
      type: object
      description: User registration request with email verification code
      properties:
        user:
          $ref: "#/components/schemas/UserRegistrationRequest"
        verificationCode:
          type: string
          description: Email verification code
          example: "123456"
      required:
        - user
        - verificationCode
    ResetPasswordRequest:
      type: object
      description: Password reset request with email verification
      properties:
        email:
          type: string
          format: email
          description: User's email address
          example: john.doe@example.com
        verificationCode:
          type: string
          description: Email verification code for password reset
          example: "123456"
        newPassword:
          type: string
          description: New password for the user
          example: NewSecurePassword123!
      required:
        - email
        - verificationCode
        - newPassword

  securitySchemes:
    bearerAuth:
      type: http
      description: "JWT token for authentication. Format: Bearer {token}"
      scheme: bearer
      bearerFormat: JWT
