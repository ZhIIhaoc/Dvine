openapi: 3.1.0
info:
  title: DVINE Experience API
  description: API documentation for DVINE Experience Management System
  contact:
    name: DVINE Team
    email: support@dvine.com
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Development Server
  - url: https://api.dvine.com
    description: Production Server
tags:
  - name: Authentication
    description: User authentication and authorization operations
  - name: Users
    description: User management operations
  - name: Catalogues
    description: Catalogue management operations
  - name: Tours
    description: Tour management operations
  - name: Approvals
    description: Tour approval management operations (DETAIL NOT DONE)
paths:
  /users/profile:
    get:
      tags:
        - Users
      summary: Get user profile
      description: Get current user's profile information
      operationId: getUserProfile
      responses:
        "401":
          description: Unauthorized
          content:
            'Application/json':
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: User not logged in
        "200":
          description: Profile retrieved successfully
          content:
            'Application/json':
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                message: success
                data:
                  userId: 1
                  email: user@example.com
                  phone: '0402777888'
                  postcode: '2017'
                  nickName: Jack
                  firstName: Mary
                  lastName: Lee
                  avatar: https://example.com/avatar.jpg
                  permission: '1'
      security:
        - bearerAuth: []
    put:
      tags:
        - Users
      summary: Update user profile
      description: Update current user's profile information
      operationId: updateUserProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
            example:
              email: user@example.com
              phone: '0402777888'
              postcode: '2017'
              nickName: Jack
              firstName: Mary
              lastName: Lee
              avatar: https://example.com/avatar.jpg
        required: true
      responses:
        "400":
          description: Invalid user data
          content:
            'Application/json':
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: You should patch at least one field
        "409":
          description: Conflict
          content:
            'Application/json':
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: The email already exists
        "401":
          description: Unauthorized
          content:
            'Application/json':
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: User not logged in
        "200":
          description: Profile updated successfully
          content:
            'Application/json':
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                message: success

      security:
        - bearerAuth: []
  /tours:
    get:
      tags:
        - Tours
      summary: Filter tours
      description: "Filter tours based on query parameters including tourId, catalogueId,\
        \ title, destination, and price range. All parameters are optional."
      operationId: search
      parameters:
        - name: tourQueryParam
          in: query
          description: Tour search and filter parameters
          required: true
          schema:
            $ref: "#/components/schemas/TourQueryParam"
      responses:
        "404":
          description: No tours found
          content:
            application/json:
              examples:
                Not Found Response:
                  description: Not Found Response
                  value:
                    code: 1
                    msg: Tour not found
        "200":
          description: Tours found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              examples:
                Success Response:
                  description: Success Response
                  value:
                    code: 0
                    msg: success
                    data:
                      - tourId: 1
                        catalogueId: 5
                        title: Amazing Sydney Harbor Tour
                        destination: "Sydney, Australia"
                        description: Experience the breathtaking views...
                        price: 299.99
                        primaryImageUrl: https://example.com/images/sydney-harbor-main.jpg
                        images:
                          - https://example.com/images/sydney1.jpg
    post:
      tags:
        - Tours
      summary: Create new tour
      description: "Create a new tour with catalogueId, title, destination, description,\
        \ price, primaryImageUrl, and images. Requires Partner level permission or\
        \ higher."
      operationId: createTour
      requestBody:
        description: Tour creation data
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Tour"
            examples:
              Tour Creation Example:
                description: Tour Creation Example
                value:
                  catalogueId: 5
                  title: Amazing Sydney Harbor Tour
                  destination: "Sydney, Australia"
                  description: Experience the breathtaking views of Sydney Harbor
                    with our professional guided tour including Opera House and Harbor
                    Bridge visits.
                  price: 299.99
                  primaryImageUrl: https://example.com/images/sydney-harbor-main.jpg
                  images:
                    - https://example.com/images/sydney1.jpg
                    - https://example.com/images/sydney2.jpg
        required: true
      responses:
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              examples:
                Unauthorized Response:
                  description: Unauthorized Response
                  value:
                    code: 1
                    msg: User not logged in
        "403":
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              examples:
                Forbidden Response:
                  description: Permission denied
                  value:
                    code: 1
                    msg: "Access denied: requires Partner level permission"
        "201":
          description: Tour created successfully
          content:
            application/json:
              examples:
                Success Response:
                  description: Success Response
                  value:
                    code: 0
                    msg: success
      security:
        - bearerAuth: []
    put:
      tags:
        - Tours
      summary: Update tour
      description: "Update an existing tour with tourId, catalogueId, title, destination,\
        \ description, price, primaryImageUrl, and images. Requires Partner level\
        \ permission or higher."
      operationId: updateTour
      requestBody:
        description: Tour update data
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Tour"
            examples:
              Tour Update Example:
                description: Tour Update Example
                value:
                  tourId: 1
                  catalogueId: 5
                  title: Updated Sydney Harbor Tour
                  destination: "Sydney, Australia"
                  description: Experience the breathtaking views of Sydney Harbor
                    with our professional guided tour including Opera House and Harbor
                    Bridge visits.
                  price: 349.99
                  primaryImageUrl: https://example.com/images/sydney-harbor-main.jpg
                  images:
                    - https://example.com/images/sydney1.jpg
                    - https://example.com/images/sydney2.jpg
        required: true
      responses:
        "404":
          description: Tour not found
          content:
            application/json:
              examples:
                Not Found Response:
                  description: Not Found Response
                  value:
                    code: 1
                    msg: Tour not found
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              examples:
                Unauthorized Response:
                  description: Unauthorized Response
                  value:
                    code: 1
                    msg: User not logged in
        "403":
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              examples:
                Partner Required Response:
                  description: Permission denied
                  value:
                    code: 1
                    msg: "Access denied: requires Partner level permission"
                Partner and Tour ID Required Response:
                  description: Tour not created by Partner
                  value:
                    code: 1
                    msg: "Partner can only modify the tour created by themselves"
        "200":
          description: Tour updated successfully
          content:
            application/json:
              examples:
                Success Response:
                  description: Success Response
                  value:
                    code: 0
                    msg: success
      security:
        - bearerAuth: []
    delete:
      tags:
        - Tours
      summary: Delete tour
      description: Delete a tour by providing tourId. Requires Partner level permission
        or higher. This action cannot be undone.
      operationId: deleteTour
      parameters:
        - name: tourId
          in: query
          description: Tour ID to delete
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "404":
          description: Tour not found
          content:
            application/json:
              examples:
                Not Found Response:
                  description: Not Found Response
                  value:
                    code: 1
                    msg: Tour not found
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              examples:
                Unauthorized Response:
                  description: Unauthorized Response
                  value:
                    code: 1
                    msg: User not logged in
        "403":
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              examples:
                Partner Required Response:
                  description: Permission denied
                  value:
                    code: 1
                    msg: "Access denied: requires Partner level permission"
                Partner and Tour ID Required Response:
                  description: Tour not created by Partner
                  value:
                    code: 1
                    msg: "Partner can only modify the tour created by themselves"
        "200":
          description: Tour deleted successfully
          content:
            application/json:
              examples:
                Success Response:
                  description: Success Response
                  value:
                    code: 0
                    msg: success
      security:
        - bearerAuth: []
  /catalogues:
    post:
      tags:
        - Catalogues
      summary: Create new catalogue
      description: Create a new catalogue (Manager permission required)
      operationId: createCatalogue
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Catalogue"
            example:
              title: Food
              description: Food catalogue
              coverImage: https://your-cdn.com/cover1.jpg
        required: true
      responses:
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: User not logged in
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: "You don't have permission to access this resource. Required level: Manager"
        "201":
          description: Catalogue created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
      security:
        - bearerAuth: []
    put:
      tags:
        - Catalogues
      summary: Update catalogue
      description: Update an existing catalogue (Manager permission required)
      operationId: updateCatalogue
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Catalogue"
            example:
              catalogueId: 2
              title: Food
              description: Updated food catalogue
              coverImage: https://your-cdn.com/cover1-updated.jpg
        required: true
      responses:
        "404":
          description: Catalogue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: Catalogue not found
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: User not logged in
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: "You don't have permission to access this resource. Required level: Manager"
        "200":
          description: Catalogue updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
      security:
        - bearerAuth: []
    delete:
      tags:
        - Catalogues
      summary: Delete catalogue
      description: Delete a catalogue (Manager permission required)
      operationId: deleteCatalogue
      parameters:
        - name: catalogueId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: User not logged in
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: "You don't have permission to access this resource. Required level: Manager"
        "200":
          description: Catalogue deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
      security:
        - bearerAuth: []
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: "Create a new user account with email, phone, password, postcode,\
        \ firstName, and lastName"
      operationId: register
      requestBody:
        description: User registration data
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistrationRequest"
            example:
              email: john.doe@example.com
              phone: "+61412345678"
              password: SecurePassword123!
              postcode: "2000"
              firstName: John
              lastName: Doe
        required: true
      responses:
        "409":
          description: Email already exists
          content:
            application/json:
              example:
                code: 1
                msg: The email already exists
        "201":
          description: User registered successfully
          content:
            application/json:
              example:
                code: 0
                msg: success
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Generate new access and refresh tokens using a valid refresh token.
        Use this to maintain user session without re-authentication.
      operationId: refreshToken
      requestBody:
        description: Refresh token request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
            example:
              refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        required: true
      responses:
        "400":
          description: Missing refresh token
          content:
            application/json:
              example:
                code: 1
                msg: Refresh token and user ID are required
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              example:
                code: 1
                msg: Invalid refresh token
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              example:
                code: 0
                msg: success
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Logout current user and invalidate all tokens. Requires valid JWT
        token in Authorization header.
      operationId: logout
      responses:
        "401":
          description: Missing or invalid token
          content:
            application/json:
              example:
                code: 1
                msg: User not logged in
        "200":
          description: Logout successful
          content:
            application/json:
              example:
                code: 0
                msg: success
      security:
        - bearerAuth: []
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticate user with email and password. Returns JWT access and
        refresh tokens upon successful authentication.
      operationId: login
      requestBody:
        description: User login credentials
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/UserLoginRequest"
            example:
              email: john.doe@example.com
              password: SecurePassword123!
        required: true
      responses:
        "401":
          description: Invalid email or password
          content:
            application/json:
              example:
                code: 1
                msg: Invalid email or password
        "200":
          description: Login successful
          content:
            application/json:
              example:
                code: 0
                msg: success
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  /approvals/tours/{pendingTourId}/reject:
    post:
      tags:
        - Approvals
      summary: Reject pending tour
      description: Reject a pending tour (Manager permission required)
      operationId: rejectPendingTour
      parameters:
        - name: pendingTourId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
        "404":
          description: Pending tour not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
        "200":
          description: Tour rejected successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
      security:
        - bearerAuth: []
  /approvals/tours/{pendingTourId}/approve:
    post:
      tags:
        - Approvals
      summary: Approve pending tour
      description: Approve a pending tour (Manager permission required)
      operationId: approvePendingTour
      parameters:
        - name: pendingTourId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
        "404":
          description: Pending tour not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
        "200":
          description: Tour approved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
      security:
        - bearerAuth: []
  /users/list:
    get:
      tags:
        - Users
      summary: Get all users
      description: Get list of all users (Manager permission required)
      operationId: getUserList
      responses:
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: User not logged in
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: "You don't have permission to access this resource. Required level: Manager"
        "200":
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                message: success
                data:
                  - userId: 1
                    email: user@example.com
                    phone: '0402777888'
                    postcode: '2017'
                    nickName: Jack
                    firstName: Mary
                    lastName: Lee
                    avatar: https://example.com/avatar.jpg
                    permission: '0'
                  - userId: 2
                    email: admin@example.com
                    phone: '0402777888'
                    postcode: '2000'
                    nickName: OWNER
                    firstName: '1'
                    lastName: '1'
                    avatar: https://example.com/avatar.jpg
                    permission: '4'

      security:
        - bearerAuth: []
  /tours/{tourId}:
    get:
      tags:
        - Tours
      summary: Get tour by ID
      description: Retrieve a specific tour by its ID with complete details including
        images.
      operationId: findById
      parameters:
        - name: tourId
          in: path
          description: Tour ID
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
        "404":
          description: Tour not found
          content:
            application/json:
              examples:
                Not Found Response:
                  description: Not Found Response
                  value:
                    code: 1
                    msg: Tour not found
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
        "200":
          description: Tour found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              examples:
                Success Response:
                  description: Success Response
                  value:
                    code: 0
                    msg: success
                    data:
                      tourId: 1
                      catalogueId: 5
                      title: Amazing Sydney Harbor Tour
                      destination: "Sydney, Australia"
                      description: Experience the breathtaking views of Sydney Harbor
                        with our professional guided tour including Opera House and
                        Harbor Bridge visits.
                      price: 299.99
                      primaryImageUrl: https://example.com/images/sydney-harbor-main.jpg
                      images:
                        - https://example.com/images/sydney1.jpg
                        - https://example.com/images/sydney2.jpg
  /tours/page:
    get:
      tags:
        - Tours
      summary: Get tours paginated (will be modified in the future)
      description: "Get tours with pagination support. Specify page number and size\
        \ for pagination. Default page=0, size=10."
      operationId: searchWithPagination
      parameters:
        - name: tourQueryParam
          in: query
          description: Pagination and filter parameters
          required: true
          schema:
            $ref: "#/components/schemas/TourQueryParam"
      responses:
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
        "200":
          description: Paginated tours retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              examples:
                Success Response:
                  description: Success Response
                  value:
                    code: 0
                    msg: success
                    data:
                      content:
                        - tourId: 1
                          catalogueId: 5
                          title: Amazing Sydney Harbor Tour
                          destination: "Sydney, Australia"
                          price: 299.99
                      page: 0
                      size: 10
                      totalElements: 100
                      totalPages: 10
                      hasNext: true
                      hasPrevious: false
  /catalogues/{catalogueId}:
    get:
      tags:
        - Catalogues
      summary: Get catalogue by ID
      description: Retrieve a specific catalogue by its ID
      operationId: getCatalogueById
      parameters:
        - name: catalogueId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "404":
          description: Catalogue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 1
                msg: Catalogue not found
        "200":
          description: Catalogue found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
                data:
                  catalogueId: 1
                  title: Default Catalogue
                  description: Build-in catalogue for the tours not assigned to any catalogue
                  coverImage: https://this-is-image-cover.jpg

  /catalogues/list:
    get:
      tags:
        - Catalogues
      summary: Get all catalogues
      description: Retrieve a list of all available catalogues
      operationId: list
      responses:
        "200":
          description: Catalogues retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"
              example:
                code: 0
                msg: success
                data:
                  - catalogueId: 2
                    title: Food
                    description: Food catalogue
                    coverImage: https://your-cdn.com/cover1.jpg
                  - catalogueId: 1
                    title: Default Catalogue
                    description: Build-in catalogue for the tours not assigned to any catalogue
                    coverImage: https://this-is-image-cover.jpg

  /approvals/tours/{pendingTourId}:
    get:
      tags:
        - Approvals
      summary: Get pending tour by ID
      description: Get specific pending tour details (Manager permission required)
      operationId: getPendingTourById
      parameters:
        - name: pendingTourId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "400":
          description: Bad Request
